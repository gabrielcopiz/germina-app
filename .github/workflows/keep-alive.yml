name: Keep Alive — Germina App

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Germina para mantenerla despierta
        run: |
          curl -sf --max-time 30 https://germina-app.onrender.com/ || true
          curl -sf --max-time 30 https://germina-app.onrender.com/admin/login || true
